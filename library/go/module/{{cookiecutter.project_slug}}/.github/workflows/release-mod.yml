name: Release Go module

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Write version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > LAST_VERSION
          sed -i "s/Version = \".*\"/Version = \"$VERSION\"/" *.go
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "📦 Update version to ${{ steps.version.outputs.version }}" || true
          git push

      - name: Warm the module proxy
        run: |
          MODULE=$(go list -m)
          curl -fsS "https://proxy.golang.org/${MODULE}/@v/${GITHUB_REF_NAME}.info" || true
