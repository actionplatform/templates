name: Templates

on:
  pull_request:
    branches: ["main", "master", "develop"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  render:
    name: render (${{ matrix.ci }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ci: [github, gitlab, jenkins, bitbucket]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cookiecutter
      - run: python scripts/render.py --ci ${{ matrix.ci }} out

  matrix:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cookiecutter
      - id: list
        run: echo "templates=$(python scripts/render.py --list)" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.template.id }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.matrix.outputs.templates) }}
    env:
      PROJECT: out/${{ matrix.template.id }}/sample-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cookiecutter
      - run: python scripts/render.py --ci github --only ${{ matrix.template.id }} out

      - if: matrix.template.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.PROJECT }}/go.mod
      - if: matrix.template.language == 'node'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - if: matrix.template.language == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.template.language == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ${{ env.PROJECT }}
      - if: matrix.template.language == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - if: matrix.template.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: setup and check (ci-scripts v1)
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p .ap
          for s in lib setup check; do
            curl -fsSL "https://raw.githubusercontent.com/actionplatform/ci-scripts/v1/$s.sh" -o ".ap/$s.sh"
          done
          chmod +x .ap/*.sh
          .ap/setup.sh
          .ap/check.sh
