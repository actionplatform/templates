services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: {{ cookiecutter.package_name }}
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
