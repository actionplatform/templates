name: Deploy

on:
  push:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to Amplify
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'master' || github.ref_name == 'main') && 'prod' || 'dev' }}
    env:
      APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      BRANCH: ${{ github.ref_name }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Start the Amplify build (or adopt the one already running)
        id: job
        run: |
          for attempt in $(seq 1 40); do
            running=$(aws amplify list-jobs --app-id "$APP_ID" --branch-name "$BRANCH" --max-results 1 \
              --query "jobSummaries[?status=='PENDING' || status=='RUNNING'].jobId" --output text)
            [ -z "$running" ] && break
            echo "job $running still running on $BRANCH, waiting"; sleep 15
          done
          if [ -n "$running" ]; then
            echo "id=$running" >> "$GITHUB_OUTPUT"; exit 0
          fi
          job_id=$(aws amplify start-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-type RELEASE \
            --query 'jobSummary.jobId' --output text)
          echo "id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for it to finish
        env:
          JOB_ID: ${{ steps.job.outputs.id }}
        run: |
          while true; do
            status=$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text)
            echo "status=$status"
            case "$status" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac
            sleep 15
          done
