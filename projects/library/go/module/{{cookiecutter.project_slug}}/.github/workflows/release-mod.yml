name: Release Go module

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actionplatform/ci-github/release@v1
        with:
          files: "*.go"
      - uses: actionplatform/ci-github/setup@v1
      - run: go vet ./...
      - run: go test ./...
      - name: Warm the module proxy
        run: |
          MODULE=$(go list -m)
          curl -fsS "https://proxy.golang.org/${MODULE}/@v/${GITHUB_REF_NAME}.info" || true
