[project]
name = "{{ cookiecutter.project_slug }}"
type = "library"
stack = "rust"
template = "cargo"
ci = "{{ cookiecutter.ci }}"
language = "rust"

[source_host]
kind = "github"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"

[release]
strategy = "semver"
changelog = "conventional"
