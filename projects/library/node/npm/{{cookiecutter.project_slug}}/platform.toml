[project]
name = "{{ cookiecutter.project_slug }}"
type = "library"
stack = "node"
template = "npm"
ci = "{{ cookiecutter.ci }}"
language = "node"

[source_host]
kind = "github"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"

[release]
strategy = "semver"
changelog = "conventional"

[[deploy.targets]]
name = "npm"
kind = "npm"
run_by = "github_actions"
workflow = "publish.yml"
package = "@{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"
stages = ["npm"]

[[deploy.targets]]
name = "npm-next"
kind = "npm"
run_by = "github_actions"
workflow = "publish.yml"
package = "@{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"
stages = ["npm-next"]
