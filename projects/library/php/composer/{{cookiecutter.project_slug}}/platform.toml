[project]
name = "{{ cookiecutter.project_slug }}"
type = "library"
stack = "php"
template = "composer"
ci = "{{ cookiecutter.ci }}"
language = "php"

[source_host]
kind = "github"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"

[release]
strategy = "semver"
changelog = "conventional"
