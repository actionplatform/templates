[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.0.0"
authors = [{ name = "{{ cookiecutter.author }}" }]
description = "{{ cookiecutter.description }}"
readme = "README.md"
license = "MIT"
requires-python = ">={{ cookiecutter._python_version }}"
dependencies = ["typer>=0.12"]

[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.package_name }}.cli:app"

[project.urls]
Repository = "https://github.com/{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"
Issues = "https://github.com/{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}/issues"

[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "0.0.0"
description = "{{ cookiecutter.description }}"
authors = ["{{ cookiecutter.author }}"]
readme = "README.md"
license = "MIT"
package-mode = true
packages = [{ include = "{{ cookiecutter.package_name }}" }]

[tool.poetry.dependencies]
python = ">={{ cookiecutter._python_version }}"
typer = ">=0.12"

[tool.poetry.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.package_name }}.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.poetry.group.code-quality.dependencies]
ruff = "^0.9.0"
mypy = "^1.13.0"

[tool.ruff]
extend = ".code_quality/ruff.toml"

[tool.mypy]
config_file = ".code_quality/mypy.ini"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
