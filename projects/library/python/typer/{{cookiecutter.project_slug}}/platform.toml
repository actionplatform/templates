[project]
name = "{{ cookiecutter.project_slug }}"
type = "library"
stack = "python"
template = "typer"
ci = "{{ cookiecutter.ci }}"
language = "python"

[source_host]
kind = "github"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"

[release]
strategy = "semver"
changelog = "conventional"

[[deploy.targets]]
name = "pypi"
kind = "pypi"
run_by = "github_actions"
workflow = "publish.yml"
package = "{{ cookiecutter.project_slug }}"
stages = ["pypi"]

[[deploy.targets]]
name = "testpypi"
kind = "pypi"
run_by = "github_actions"
workflow = "publish.yml"
package = "{{ cookiecutter.project_slug }}"
index_url = "https://test.pypi.org"
stages = ["testpypi"]
