[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.0.0"
authors = [{% if cookiecutter.author %}{ name = "{{ cookiecutter.author }}" }{% endif %}]
description = "{{ cookiecutter.description }}"
readme = "README.md"
{% if cookiecutter.__spdx %}license = "{{ cookiecutter.__spdx }}"
{% endif %}requires-python = ">={{ cookiecutter._python_version }}"
keywords = ["sdk", "api-client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Repository = "https://{{ cookiecutter.__domain }}/{{ cookiecutter.__owner }}/{{ cookiecutter.project_slug }}"
Issues = "https://{{ cookiecutter.__domain }}/{{ cookiecutter.__owner }}/{{ cookiecutter.project_slug }}/issues"

[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "0.0.0"
description = "{{ cookiecutter.description }}"
authors = [{% if cookiecutter.author %}"{{ cookiecutter.author }}"{% endif %}]
readme = "README.md"
{% if cookiecutter.__spdx %}license = "{{ cookiecutter.__spdx }}"
{% endif %}package-mode = true
packages = [{ include = "{{ cookiecutter.package_name }}" }]

[tool.poetry.dependencies]
python = ">={{ cookiecutter._python_version }}"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"

[tool.poetry.group.code-quality.dependencies]
ruff = "^0.16.0"
mypy = "^1.13.0"

[tool.ruff]
extend = ".code_quality/ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
