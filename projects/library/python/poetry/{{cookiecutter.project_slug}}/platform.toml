[project]
name = "{{ cookiecutter.project_slug }}"
type = "library"
stack = "python"
template = "poetry"
ci = "{{ cookiecutter.ci }}"
language = "python"

{% if cookiecutter.github_owner %}[source_host]
kind = "{{ cookiecutter.source_host }}"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"
{% endif %}
[release]
strategy = "semver"
changelog = "conventional"

[[deploy.targets]]
name = "pypi"
kind = "pypi"
run_by = "github_actions"
workflow = "publish.yml"
package = "{{ cookiecutter.project_slug }}"

[gitflow.protection]
enforce = true
