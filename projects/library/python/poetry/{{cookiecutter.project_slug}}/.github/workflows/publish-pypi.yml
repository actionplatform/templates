name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actionplatform/ci-github/release@v1
        with:
          files: "pyproject.toml PACKAGE_DIR/__init__.py"
      - uses: actionplatform/ci-github/setup@v1
      - run: poetry run ruff check .
      - run: poetry run pytest
      - run: poetry build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.release.prerelease && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true
