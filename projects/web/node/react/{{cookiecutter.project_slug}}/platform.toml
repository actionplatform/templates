[project]
name = "{{ cookiecutter.project_slug }}"
type = "web"
stack = "node"
template = "react"
ci = "{{ cookiecutter.ci }}"
language = "node"

[source_host]
kind = "github"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"

[release]
strategy = "semver"
changelog = "conventional"

[build]
start = "npx serve -s build -l ${PORT:-8000}"
