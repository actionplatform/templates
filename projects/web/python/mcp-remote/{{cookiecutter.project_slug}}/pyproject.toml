[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "0.0.0"
package-mode = false
description = "{{ cookiecutter.description }}"
authors = [{% if cookiecutter.author %}"{{ cookiecutter.author }}"{% endif %}]
readme = "README.md"

[tool.poetry.dependencies]
python = "^{{ cookiecutter._python_version }}"
fastmcp = "^4.2"
uvicorn = { extras = ["standard"], version = "^0.54.0" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24"
httpx2 = "^2.16"

[tool.poetry.group.code-quality.dependencies]
ruff = "^0.16.0"
mypy = "^1.13.0"

[tool.ruff]
extend = ".code_quality/ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
