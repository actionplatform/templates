[project]
name = "{{ cookiecutter.project_slug }}"
type = "web"
stack = "ruby"
template = "sinatra"
ci = "{{ cookiecutter.ci }}"
language = "ruby"

[source_host]
kind = "github"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"

[release]
strategy = "semver"
changelog = "conventional"
