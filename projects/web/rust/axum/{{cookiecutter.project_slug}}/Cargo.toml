[package]
name = "{{ cookiecutter.package_name }}"
version = "0.0.0"
edition = "2021"
description = "{{ cookiecutter.description }}"
{% if cookiecutter.__spdx %}license = "{{ cookiecutter.__spdx }}"
{% endif %}repository = "https://{{ cookiecutter.__domain }}/{{ cookiecutter.__owner }}/{{ cookiecutter.project_slug }}"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
