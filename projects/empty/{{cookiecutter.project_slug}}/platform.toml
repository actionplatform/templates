[project]
name = "{{ cookiecutter.project_slug }}"
type = "empty"
stack = ""
template = ""
ci = ""
language = ""

{% if cookiecutter.github_owner %}[source_host]
kind = "{{ cookiecutter.source_host }}"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"
{% endif %}
[release]
strategy = "semver"
changelog = "conventional"

[gitflow.protection]
enforce = true
