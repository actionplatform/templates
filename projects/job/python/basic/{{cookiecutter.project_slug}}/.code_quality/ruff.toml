line-length = 79
target-version = "py{{ cookiecutter._python_version|replace('.', '') }}"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008", "E203"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["ARG001", "S101"]

[lint.isort]
known-first-party = ["app"]
force-single-line = false

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
