[project]
name = "{{ cookiecutter.project_slug }}"
type = "plugin"
stack = "chrome"
template = "vanilla"
ci = "{{ cookiecutter.ci }}"
language = "node"

[source_host]
kind = "github"
repo = "{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}"

[release]
strategy = "semver"
changelog = "conventional"
