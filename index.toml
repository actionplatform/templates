# Template matrix read by `action-platform init`.
# [projects.type.stack.template] — app templates
# [cloud.provider.service]       — deploy overlays applied on top of a project

[projects.web.python.fastapi]
default = true
description = "FastAPI + uvicorn + pydantic"

[projects.web.python.fastmcp]
description = "FastMCP server (Model Context Protocol over HTTP)"

[projects.web.java.spring]
default = true
description = "Spring Boot web API (Maven, JDK 17)"

[projects.web.kotlin.spring]
default = true
description = "Spring Boot web API in Kotlin (Maven, JDK 17)"

[projects.web.go.gin]
default = true
description = "Gin + net/http"

[projects.web.node.react]
default = true
description = "React + webpack + jest"

[projects.library.python.poetry]
default = true
description = "Poetry package"

[projects.library.go.module]
default = true
description = "Go module"

[projects.library.php.composer]
default = true
description = "Composer package"

[projects.library.node.npm]
default = true
description = "npm package + TypeScript"

[projects.library.java.maven]
default = true
description = "Maven artifact"

[projects.library.rust.cargo]
default = true
description = "Cargo crate"

[projects.docs.mkdocs.material]
default = true
description = "MkDocs Material"

[projects.plugin.chrome.vanilla]
default = true
description = "Chrome extension, Manifest V3, no bundler"

[projects.empty]
description = "Only platform.toml + .code_quality/"

[cloud.aws.lambda]
description = "AWS Lambda + HTTP API Gateway via SAM"
languages = ["python"]
types = ["web"]

[cloud.docker]
description = "Dockerfile + docker-compose"
languages = ["python", "go", "node"]
types = ["web"]

[cloud.aws.amplify]
description = "AWS Amplify Hosting (static build)"
languages = ["node"]
types = ["web"]

[service.postgres]
description = "PostgreSQL database"
providers = ["docker", "aws-rds"]
